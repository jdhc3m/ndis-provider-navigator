name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          enable-cache: true
          python-version: '3.12'
      # The committed uv.lock is always resolved here against PyPI. Developer
      # machines may resolve through a package mirror whose URLs must never be
      # committed, so CI regenerates the lock, publishes it as an artifact and
      # fails if the committed one differs. Download `uv-lock` and commit it.
      - run: uv lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uv-lock
          path: uv.lock
      - name: Committed uv.lock must match the PyPI resolution
        run: git add --intent-to-add uv.lock && git diff --exit-code -- uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest -m 'not eval'
      - run: uv run python scripts/check_no_stubs.py
      - run: uv run python scripts/check_private_data.py --tracked
      # The eval gate runs the committed captures: the intent-accuracy suite replays
      # evals/intent_cache.yaml (the recorded answers of the configured small model)
      # through the real parser and enforces the thresholds.yaml floors — no database,
      # no endpoint, no quota. Suites that need data/ (the register snapshot, the rule
      # index, the private extraction and embedding caches) skip here with a visible
      # notice; they keep enforcing their floors on machines that have the data.
      - name: Model evaluation gate
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -m eval --no-cov -rs 2>&1 | tee /tmp/eval-gate.txt
          if grep -q '^SKIPPED' /tmp/eval-gate.txt; then
            echo '::notice::Data-backed eval suites skipped in CI: they need data/ (the register snapshot, the rule index, the private extraction and embedding caches), which is never committed. Their thresholds stay enforced on machines with the data; the intent-accuracy suite runs here from the committed capture.'
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the `packageManager` field in web/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # The committed TypeScript schema must match what the FastAPI app exports, so a
      # backend contract change that the page does not handle fails here, next to the
      # typecheck that consumes it. Needs the Python app, hence uv in this job too.
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          enable-cache: true
          python-version: '3.12'
      - run: uv sync --locked
        working-directory: .
      - name: Generated API schema must match the committed one
        working-directory: .
        run: |
          uv run python scripts/export_openapi.py openapi.json
          pnpm --dir web gen:schema
          git diff --exit-code -- web/src/api/schema.d.ts
      - run: pnpm build
