- question: "Can a provider claim for a participant's transport in a group setting?"
  answer: "Yes, providers can claim for activity-based transport when transporting two or more participants on the same trip by apportioning the worker's time amongst the participants, and non-labour transport support items can also be delivered to groups of participants subject to the rules set out in the NDIS Pricing Arrangements and Price Limits."
  citations: "[{\"page\": 28, \"quote\": \"Where a provider is transporting two or more participants on the same trip, the worker\\u2019s time should be apportioned amongst participants. This claim should be made using the relevant community participation support item and against the participant\\u2019s core budget.\"}, {\"page\": 28, \"quote\": \"These support items can be delivered to individual participants and to groups of participants subject to the rules set out in the NDIS Pricing Arrangements and Price Limits.\"}]"
