  citations: "[{\"page\": 26, \"quote\": \"Short Notice Cancellations Where a provider has a Short Notice Cancellation (or no show), they can claim up to 100% of the agreed fee associated with the activity from the participant\\u2019s plan, subject to the NDIS Pricing Arrangements and Price Limits and the terms of the service agreement with the participant.\"}]"
