  citations: "[{\"page\": 26, \"quote\": \"Short Notice Cancellation \\u2013 2 clear business days \\u2022 This policy typically applies to non-DSW supports where a participant has provided less than two (2) clear business days\\u2019 notice of cancellation for a support\"}]"
