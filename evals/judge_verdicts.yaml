  citations: "[{\"page\": 21, \"quote\": \"time spent on Non-Face-to-Face activities that assist the participant \\u2013 for example, writing reports for co-workers and other providers about the client\\u2019s progress with skill development \\u2013 could be claimed against this support item.\"}]"
