- question: "Are there limits on claiming transport for community participation supports?"
  answer: "For community participation supports, providers can bill the plan for the support worker's time at the agreed hourly rate and negotiate non-labour contributions, such as up to $0.99 a kilometre for unmodified vehicles, up to $2.76 a kilometre for accessible vehicles or buses, and full amounts for tolls, parking, or public transport."
  citations: "[{\"page\": 28, \"quote\": \"For a vehicle that is not modified for accessibility, up to $0.99 a kilometre; \\u2022 For a vehicle that is modified for accessibility or a bus, up to $2.76 a kilometre; \\u2022 For other forms of transport or associated costs, such as road tolls, parking, and public transport fares, up to the full amount.\"}]"
