- question: "Can a provider charge for the time spent travelling to a participant, and how is it limited?"
  answer: "Providers can claim travel costs from a participant's plan when delivering a specific disability support item under certain conditions, such as when the primary support is face-to-face, the participant has agreed in advance, and the provider is required to pay the worker for travel time. Travel time claims are limited by the Modified Monash Model (MMM) area (for instance, up to 30 minutes in MMM1-3 areas and up to 60 minutes in MMM4-5 areas for each eligible worker), and therapy support travel time is price-capped at 50% of the regular price limit."
  citations: "[{\"page\": 22, \"quote\": \"For therapy supports providers, including early childhood therapy, the price limit for provider travel time is 50% of the regular price limit for these items.\"}]"
  similarity: 0.7798
  model_supported: true
