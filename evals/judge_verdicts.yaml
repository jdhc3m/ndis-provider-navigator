- question: "How are therapy assistant hours claimed and at what rate?"
  answer: "Therapy assistants are classified into Level 1 (requiring direct supervision at all times, with a national hourly rate of $56.16) and Level 2 (working under supervision and able to work independently, with a national hourly rate of $86.79). When Level 2 therapy assistants require specific training from the therapist before taking responsibility, providers can bill for the time spent by both the therapist and the therapy assistant."
  citations: "[{\"page\": 37, \"quote\": \"In these cases, it is appropriate for the provider to bill for the time spent by both the therapist and the therapy assistant. This arrangement can represent value for money for the participant compared to the alternative of all supports being delivered by the supervising therapists.\"}]"
